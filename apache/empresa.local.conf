<VirtualHost *:80>

    ServerName empresa.local
    ServerAlias www.empresa.local

    DocumentRoot /var/www/empresa.local

    <Directory /var/www/empresa.local>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/empresa.local-error.log
    CustomLog ${APACHE_LOG_DIR}/empresa.local-access.log combined

</VirtualHost>

