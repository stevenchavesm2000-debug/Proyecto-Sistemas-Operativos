<VirtualHost *:80>
    ServerAdmin admin@curso.local
    ServerName curso.local
    ServerAlias www.curso.local
    DocumentRoot /var/www/curso.local
    
    <Directory /var/www/curso.local>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/curso.local_error.log
    CustomLog ${APACHE_LOG_DIR}/curso.local_access.log combined
</VirtualHost>
